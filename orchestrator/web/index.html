<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multi-Agent Orchestrator</title>
<style>
/* ==========================================================================
   AWS Cloudscape design language, hand-written against the published tokens.

   WHY TOKENS AND NOT THE REACT LIBRARY: Cloudscape ships as React components, which
   would mean npm + a bundler + a build step in both IaC paths, a CloudFront SPA
   error-page rule, and a rewrite of tests/test_asset_rendering.py (it slices this
   page's own functions out and runs them under node). This deployment uploads three
   static files and has no Node toolchain. So the VISUAL SYSTEM is reproduced here —
   the same type scale, spacing grid, palette, container and status vocabulary — and
   the page stays a single file anyone can open. Swapping in the real components later
   is a contained change: the markup below already follows Cloudscape's structure
   (TopNavigation / SideNavigation / ContentLayout / Container+Header / SplitPanel).

   Token names in comments are the official ones, so a value can be checked against
   cloudscape.design rather than taken on trust.
   ========================================================================== */

:root {
  /* --- palette ---------------------------------------------------------- */
  --awsui-blue:            #0972d3;   /* color-background-button-primary-default */
  --awsui-blue-hover:      #065299;
  --awsui-blue-active:     #033160;
  --awsui-link:            #0972d3;   /* color-text-link-default */
  --awsui-navy:            #0f1b2a;   /* top navigation */
  --awsui-navy-2:          #192b3d;

  --awsui-bg-layout:       #f2f3f3;   /* color-background-layout-main */
  --awsui-bg-container:    #ffffff;   /* color-background-container-content */
  --awsui-bg-header:       #fbfbfb;   /* container header */
  --awsui-bg-input:        #ffffff;
  --awsui-bg-hover:        #f4f4f4;   /* color-background-dropdown-item-hover */
  --awsui-bg-selected:     #f0fbff;   /* color-background-item-selected */
  --awsui-bg-code:         #f4f4f4;

  --awsui-text:            #0f141a;   /* color-text-heading-default */
  --awsui-text-body:       #0f141a;
  --awsui-text-secondary:  #424650;   /* color-text-body-secondary */
  --awsui-text-muted:      #656871;   /* color-text-status-inactive */
  --awsui-text-inverted:   #ffffff;

  --awsui-border:          #c6c6cd;   /* color-border-input-default */
  --awsui-divider:         #e9ebed;   /* color-border-divider-default */
  --awsui-border-strong:   #8c8c94;

  --awsui-success:         #00802f;   /* color-text-status-success */
  --awsui-error:           #db0000;   /* color-text-status-error */
  --awsui-warning:         #8d6605;   /* color-text-status-warning */
  --awsui-info:            #0972d3;   /* color-text-status-info */
  --awsui-inactive:        #656871;

  /* --- radii, shadow, spacing (4px grid) -------------------------------- */
  --awsui-radius-container: 16px;     /* border-radius-container */
  --awsui-radius-item:      8px;
  --awsui-radius-control:   8px;      /* border-radius-input */
  --awsui-radius-badge:     16px;     /* border-radius-badge */
  --awsui-shadow-container: 0 0 1px 1px #e9ebed, 0 1px 8px 2px rgba(0,7,22,.12);
  --awsui-shadow-panel:     0 1px 4px 1px rgba(0,7,22,.1);
  --awsui-shadow-popover:   0 4px 20px 1px rgba(0,7,22,.1);

  /* Legacy aliases: observability.js reads --bg1/--bg2 for its own background. */
  --bg1: #f2f3f3;
  --bg2: #f2f3f3;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  /* font-family-base */
  font-family: "Amazon Ember", "Helvetica Neue", Roboto, Arial, sans-serif;
  font-size: 14px;            /* font-size-body-m */
  line-height: 20px;          /* line-height-body-m */
  color: var(--awsui-text-body);
  background: var(--awsui-bg-layout);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; color: var(--awsui-text); font-weight: 700; }
h2 { font-size: 18px; line-height: 22px; }   /* font-size-heading-m */
h3 { font-size: 16px; line-height: 20px; }   /* font-size-heading-s */
a { color: var(--awsui-link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ==========================================================================
   TopNavigation
   ========================================================================== */

header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  height: 56px;
  flex: 0 0 auto;
  background: var(--awsui-navy);
  color: var(--awsui-text-inverted);
  position: relative;
  z-index: 20;
}

header h1 {
  font-size: 16px;
  line-height: 20px;
  font-weight: 700;
  color: var(--awsui-text-inverted);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* NO ::before mark here. `ui.heading` in workflow.json is the customer's brand line
   and the sample's already starts with a glyph — a CSS mark on top of it rendered two
   logos. The heading is theirs; the shell does not decorate it. */

.topnav { display: flex; align-items: center; gap: 4px; }

.navbtn {
  appearance: none;
  border: 0;
  background: transparent;
  color: #d1d5db;
  font: inherit;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: var(--awsui-radius-control);
  cursor: pointer;
  white-space: nowrap;
}
.navbtn:hover { background: rgba(255,255,255,.1); color: #fff; }
.navbtn.active { background: rgba(255,255,255,.16); color: #fff; }

header .spacer { flex: 1; }

header .user {
  font-size: 12px;
  line-height: 16px;
  color: #d1d5db;
  white-space: nowrap;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Inputs in the dark header get a light surface, as the console search does. */
header input {
  font: inherit;
  font-size: 14px;
  color: var(--awsui-text-body);
  background: var(--awsui-bg-input);
  border: 1px solid transparent;
  border-radius: var(--awsui-radius-control);
  padding: 6px 10px;
  height: 32px;
  min-width: 0;
}
header input:focus {
  outline: 2px solid #539fe5;
  outline-offset: 1px;
  border-color: transparent;
}
header input#topic { flex: 1 1 340px; }
header input#subject { flex: 0 1 200px; }

header button#start {
  appearance: none;
  font: inherit;
  font-weight: 700;
  height: 32px;
  padding: 0 20px;
  border-radius: var(--awsui-radius-control);
  border: 1px solid var(--awsui-blue);
  background: var(--awsui-blue);
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
}
header button#start:hover:not(:disabled) { background: var(--awsui-blue-hover); border-color: var(--awsui-blue-hover); }
header button#start:disabled { opacity: .45; cursor: not-allowed; }

header button.ghost {
  appearance: none;
  font: inherit;
  font-weight: 700;
  height: 32px;
  padding: 0 14px;
  border-radius: var(--awsui-radius-control);
  border: 1px solid rgba(255,255,255,.4);
  background: transparent;
  color: #fff;
  cursor: pointer;
}
header button.ghost:hover { background: rgba(255,255,255,.12); }

/* ==========================================================================
   AppLayout: SideNavigation | content | SplitPanel
   ========================================================================== */

main {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}

/* --- SideNavigation ----------------------------------------------------- */
.sidebar {
  flex: 0 0 300px;
  background: var(--awsui-bg-container);
  border-right: 1px solid var(--awsui-divider);
  overflow-y: auto;
  padding: 16px 0;
}

.sidebar .navhead {
  padding: 4px 20px 12px;
  font-size: 18px;
  line-height: 22px;
  font-weight: 700;
  color: var(--awsui-text);
  border-bottom: 1px solid var(--awsui-divider);
  margin-bottom: 8px;
}

.sess {
  position: relative;
  display: block;
  padding: 10px 40px 10px 20px;
  cursor: pointer;
  border-left: 4px solid transparent;
}
.sess:hover { background: var(--awsui-bg-hover); }
.sess.active {
  background: var(--awsui-bg-selected);
  border-left-color: var(--awsui-blue);
}
/* `.topic` is the run's subject line in a session row. Two lines, then ellipsis —
   a topic is a sentence, and truncating it to one line loses the part that tells
   two similar runs apart. */
.sess .topic {
  font-weight: 700;
  color: var(--awsui-text);
  font-size: 14px;
  line-height: 18px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sess .id {
  font-family: Monaco, Menlo, monospace;
  font-size: 11px;
  line-height: 16px;
  color: var(--awsui-text-muted);
  margin-top: 2px;
}
.sess .t, .sess .sub { display: block; }
.sess .sub { margin-top: 4px; font-size: 12px; color: var(--awsui-text-muted); }

.sessdel {
  position: absolute;
  top: 8px; right: 10px;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--awsui-text-muted);
  font-size: 14px;
  line-height: 1;
  width: 24px; height: 24px;
  border-radius: 4px;
  cursor: pointer;
  opacity: 0;
}
.sess:hover .sessdel { opacity: 1; }
.sessdel:hover { background: #fff0f0; color: var(--awsui-error); }

/* --- content ------------------------------------------------------------ */
.content { flex: 1; overflow-y: auto; min-width: 0; }
.wrap { padding: 24px; max-width: 1360px; }
#wrap { display: flex; flex-direction: column; gap: 20px; }

.empty {
  background: var(--awsui-bg-container);
  border-radius: var(--awsui-radius-container);
  box-shadow: var(--awsui-shadow-container);
  padding: 48px 24px;
  text-align: center;
  color: var(--awsui-text-secondary);
}

/* --- SplitPanel (right) ------------------------------------------------- */
/* Where a selected node's detail goes, matching Step Functions' execution view:
   graph on the left, the selected state's detail on the right. */
.splitpanel {
  flex: 0 0 520px;
  max-width: 48vw;
  background: var(--awsui-bg-container);
  border-left: 1px solid var(--awsui-divider);
  box-shadow: var(--awsui-shadow-panel);
  display: none;
  flex-direction: column;
  min-height: 0;
}
.splitpanel.open { display: flex; }

.sp-head {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--awsui-divider);
  background: var(--awsui-bg-header);
}
.sp-title { flex: 1; min-width: 0; }
.sp-title h2 {
  font-size: 18px;
  line-height: 22px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sp-sub {
  margin-top: 4px;
  font-size: 12px;
  line-height: 16px;
  color: var(--awsui-text-muted);
  font-family: Monaco, Menlo, monospace;
}
.sp-x {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--awsui-text-secondary);
  font-size: 18px;
  line-height: 1;
  width: 28px; height: 28px;
  border-radius: 4px;
  cursor: pointer;
  flex: 0 0 auto;
}
.sp-x:hover { background: var(--awsui-bg-hover); }
.sp-body { flex: 1; overflow-y: auto; padding: 16px 20px 32px; }
.sp-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* ==========================================================================
   Container + Header
   ========================================================================== */

.card {
  background: var(--awsui-bg-container);
  border-radius: var(--awsui-radius-container);
  box-shadow: var(--awsui-shadow-container);
  padding: 20px 24px;
}
.card > h2 { margin-bottom: 16px; }

/* An expandable Container renders its header as the summary row. */
details.card { padding: 0; }
details.card > .secsum { padding: 20px 24px; }
details.card[open] > .secsum { border-bottom: 1px solid var(--awsui-divider); }
details.card > :not(summary) { padding: 16px 24px 20px; }

.secsum {
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  color: var(--awsui-text);
}
.secsum::-webkit-details-marker { display: none; }
.ochev {
  display: inline-block;
  color: var(--awsui-text-secondary);
  transition: transform .15s ease;
  font-size: 11px;
}
details[open] > .secsum .ochev { transform: rotate(90deg); }

.outputs-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.hint { font-size: 12px; line-height: 16px; color: var(--awsui-text-muted); }
.muted { color: var(--awsui-text-muted); }
.warn { color: var(--awsui-warning); }

/* ==========================================================================
   Buttons
   ========================================================================== */

button, .act {
  font-family: inherit;
}

/* normal variant */
.ghost, .act {
  appearance: none;
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  height: 32px;
  padding: 0 20px;
  border-radius: var(--awsui-radius-control);
  border: 1px solid var(--awsui-blue);
  background: transparent;
  color: var(--awsui-blue);
  cursor: pointer;
  white-space: nowrap;
}
.ghost:hover:not(:disabled), .act:hover:not(:disabled) { background: #f2f8fd; }
.ghost:disabled, .act:disabled {
  border-color: var(--awsui-border);
  color: var(--awsui-text-muted);
  cursor: not-allowed;
  background: transparent;
}

/* primary variant */
.approve {
  appearance: none;
  font: inherit;
  font-weight: 700;
  height: 32px;
  padding: 0 20px;
  border-radius: var(--awsui-radius-control);
  border: 1px solid var(--awsui-blue);
  background: var(--awsui-blue);
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
}
.approve:hover:not(:disabled) { background: var(--awsui-blue-hover); border-color: var(--awsui-blue-hover); }
.approve:disabled { opacity: .45; cursor: not-allowed; }

.revise {
  appearance: none;
  font: inherit;
  font-weight: 700;
  height: 32px;
  padding: 0 20px;
  border-radius: var(--awsui-radius-control);
  border: 1px solid var(--awsui-border);
  background: transparent;
  color: var(--awsui-text);
  cursor: pointer;
  white-space: nowrap;
}
.revise:hover:not(:disabled) { background: var(--awsui-bg-hover); }
.revise:disabled { color: var(--awsui-text-muted); cursor: not-allowed; }

/* destructive */
.deny, .reject {
  appearance: none;
  font: inherit;
  font-weight: 700;
  height: 32px;
  padding: 0 20px;
  border-radius: var(--awsui-radius-control);
  border: 1px solid var(--awsui-error);
  background: transparent;
  color: var(--awsui-error);
  cursor: pointer;
  white-space: nowrap;
}
.deny:hover:not(:disabled), .reject:hover:not(:disabled) { background: #fff0f0; }
.deny:disabled, .reject:disabled { border-color: var(--awsui-border); color: var(--awsui-text-muted); cursor: not-allowed; }

.actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ==========================================================================
   StatusIndicator + progress
   ========================================================================== */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  line-height: 16px;
  font-weight: 400;
  white-space: nowrap;
  color: var(--awsui-text-secondary);
}
/* The status GLYPH. Cloudscape pairs a shape with the colour so the state is not
   carried by hue alone; `badge()` supplies the character. */
.badge .dot {
  flex: 0 0 auto;
  font-size: 12px;
  line-height: 16px;
  font-weight: 700;
  color: currentColor;
}
/* Cloudscape colours the ICON and leaves the label in body text. */
.b-done      { color: var(--awsui-success); }
.b-running   { color: var(--awsui-info); }
.b-waiting_human { color: var(--awsui-warning); }
.b-failed    { color: var(--awsui-error); }
.b-denied    { color: var(--awsui-error); }
.b-cancelled { color: var(--awsui-text-muted); }
.b-cancelling { color: var(--awsui-warning); }
.b-skipped   { color: var(--awsui-text-muted); }
.b-pending   { color: var(--awsui-text-muted); }
.b-revise    { color: var(--awsui-warning); }

.spinner {
  width: 14px; height: 14px;
  border: 2px solid #c6dbf0;
  border-top-color: var(--awsui-blue);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
  flex: 0 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

.bar {
  margin-top: 10px;
  height: 4px;
  border-radius: 2px;
  background: var(--awsui-divider);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--awsui-blue);
  border-radius: 2px;
  transition: width .4s ease;
}

/* ==========================================================================
   The workflow graph — Step Functions layout
   Vertical flow, one stage per row, connectors with arrowheads, parallel
   branches inside a bracketed group.
   ========================================================================== */

.dag {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 8px 4px 4px;
  overflow-x: auto;
}

/* The connector between two stages. */
.arrow {
  width: 2px;
  height: 28px;
  background: var(--awsui-border-strong);
  position: relative;
  flex: 0 0 auto;
}
.arrow::after {                     /* arrowhead */
  content: "";
  position: absolute;
  left: 50%; bottom: -1px;
  transform: translateX(-50%);
  border-left: 5px solid transparent;
  border-right: 5px solid transparent;
  border-top: 7px solid var(--awsui-border-strong);
}
.arrow svg { display: none; }       /* the inline SVG is superseded by the CSS connector */

.stage-body {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  /* The gutters hold the stage number (left) and the Review/Branch pills (right),
     both absolutely positioned. A pill is up to ~96px wide, so a narrower gutter
     puts it on top of the node — which is what 56px did. Symmetric, so the node
     still sits on the centre line the connectors are drawn down. */
  padding: 0 132px;
}

/* Stage number, as Step Functions numbers a state. */
.stage-num {
  position: absolute;
  left: 92px;                       /* 132px gutter − 24px badge − 16px gap */
  top: 8px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--awsui-bg-layout);
  border: 1px solid var(--awsui-border);
  color: var(--awsui-text-secondary);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stage-gate, .stage-branch {
  position: absolute;
  left: calc(100% - 116px);         /* content's right edge + 16px */
  right: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  line-height: 16px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: var(--awsui-radius-badge);
  white-space: nowrap;
  cursor: default;
}
.stage-gate  { top: 6px;  background: #fbf4e6; color: var(--awsui-warning); border: 1px solid #f0d99a; }
.stage-branch{ top: 34px; background: #f2f8fd; color: var(--awsui-blue);    border: 1px solid #b8d9f5; }

/* A parallel / sequence group: Step Functions draws these as a labelled frame. */
.stage-group {
  position: relative;
  border: 1px dashed var(--awsui-border);
  border-radius: var(--awsui-radius-container);
  background: #fafafa;
  padding: 26px 20px 20px;
}
.stage-group-title {
  position: absolute;
  top: -11px; left: 16px;
  background: var(--awsui-bg-container);
  padding: 1px 10px;
  border: 1px solid var(--awsui-border);
  border-radius: var(--awsui-radius-badge);
  font-size: 12px;
  line-height: 16px;
  font-weight: 700;
  color: var(--awsui-text-secondary);
  white-space: nowrap;
}
.stage-col { display: grid; gap: 16px; justify-content: center; }
.stage-row { display: flex; align-items: center; gap: 0; }

.seq-arrow {
  width: 32px;
  height: 2px;
  background: var(--awsui-border-strong);
  position: relative;
  flex: 0 0 auto;
}
.seq-arrow::after {
  content: "";
  position: absolute;
  top: 50%; right: -1px;
  transform: translateY(-50%);
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 7px solid var(--awsui-border-strong);
}
.seq-arrow svg { display: none; }

/* --- a state box -------------------------------------------------------- */
.node {
  width: 240px;
  background: var(--awsui-bg-container);
  border: 2px solid var(--awsui-border-strong);
  border-radius: var(--awsui-radius-item);
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  transition: border-color .12s ease, box-shadow .12s ease, background .12s ease;
}
.node:hover { box-shadow: var(--awsui-shadow-popover); }
.node:focus-visible { outline: 2px solid var(--awsui-blue); outline-offset: 2px; }

/* Status is carried on the LEFT EDGE, as Step Functions colours a state. */
.node.done          { border-left-color: var(--awsui-success);  border-left-width: 6px; }
.node.running       { border-left-color: var(--awsui-info);     border-left-width: 6px; }
.node.waiting_human { border-left-color: var(--awsui-warning);  border-left-width: 6px; }
.node.failed        { border-left-color: var(--awsui-error);    border-left-width: 6px; }
.node.denied        { border-left-color: var(--awsui-error);    border-left-width: 6px; }
.node.cancelled     { border-left-color: var(--awsui-inactive); border-left-width: 6px; }
.node.skipped       { border-left-color: var(--awsui-inactive); border-left-width: 6px; opacity: .6; }
.node.pending       { border-color: var(--awsui-border); }

.node.selected {
  border-color: var(--awsui-blue);
  box-shadow: 0 0 0 3px rgba(9,114,211,.2);
  background: var(--awsui-bg-selected);
}
/* When one node is focused the others recede, so the selection is unmistakable. */
.dag.has-selection .node:not(.selected) { opacity: .5; }

.node .head { display: flex; align-items: center; gap: 10px; }

              title="Close">&#10005;</button>
