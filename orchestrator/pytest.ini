[pytest]
# Run from orchestrator/ with: pytest
#
# tests/ holds the CONFIG-PLANE suite — the code that turns workflow.json into a
# running system. It calls no AWS APIs and no model, so the whole suite is about a
# second and is safe in CI. See tests/README.md.
testpaths = tests
# Short tracebacks: these are assertions about config, not deep stacks.
addopts = -q --tb=short
filterwarnings =
    # Fail on a DeprecationWarning from our own code, so a pydantic/langgraph
    # deprecation is caught here rather than at the next dependency bump.
    error::DeprecationWarning:app.*
    error::DeprecationWarning:authz
    error::DeprecationWarning:chatbot
